[project]
name = "model-kd"
version = "0.1.0"
description = "This project build to detect/prevent the Unauthorise model distrilation on api based extraction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.5.6",
    "matplotlib>=3.9",
    "numpy>=2.4.6",
    "optuna>=4",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentence-transformers>=6.1.0",
]

[project.optional-dependencies]
gpu = ["peft", "bitsandbytes", "accelerate"]  # teacher adapter, student LoRA; GPU machine only

[tool.uv]
no-binary-package = ["fonttools"]  # Windows Application Control blocks its compiled iup DLL; pure Python is identical
